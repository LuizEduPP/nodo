name: Bug
description: Something is broken in the mesh, store, or command.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Command, error text, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: Steps, how many machines, same network or not.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: git sha or install path
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, TCP 9400 reachable or not
